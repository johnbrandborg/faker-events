name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Test
      if: matrix.python-version != '3.11'
      run: make test
    - name: Test with coverage report
      if: matrix.python-version == '3.11'
      run: make test_report
    - name: SonarQube Scan
      if: matrix.python-version == '3.11'
      uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=johnbrandborg
          -Dsonar.projectKey=johnbrandborg_faker-events
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.python.version=${{ matrix.python-version }}
          -Dsonar.sources=faker_events/
          -Dsonar.test.exclusions=tests/**
          -Dsonar.tests=tests/

  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - run: pip install -e ".[dev]"
    - run: ruff format --check .
    - run: ruff check .
    - name: Type checking
      run: make type_check
