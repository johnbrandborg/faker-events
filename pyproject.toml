[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "faker-events"
dynamic = ["version"]
description = "Generate realistic, stateful event streams without production data."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "John Brandborg" }]
keywords = ["faker", "events", "streaming", "synthetic-data", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "croniter>=2.0",
    "faker>=25.0",
    "orjson>=3.10",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5"]
kinesis = ["boto3>=1.34"]
all = [
    "boto3>=1.34",
    "confluent-kafka>=2.5",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ty>=0.0.1a25",
]

[project.scripts]
faker-events = "faker_events.cli:app"

[project.urls]
Source = "https://github.com/johnbrandborg/faker-events"
Issues = "https://github.com/johnbrandborg/faker-events/issues"

[tool.hatch.version]
path = "faker_events/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["faker_events"]

[tool.pytest.ini_options]
addopts = "--cov=faker_events --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "faker_events/__main__.py",
    "faker_events/events.py",
    "faker_events/handlers.py",
    "faker_events/profiles.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["faker_events", "tests"]

[tool.ty.terminal]
error-on-warning = false

[tool.coverage.xml]
output = "coverage.xml"
